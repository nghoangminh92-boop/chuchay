<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrix Message</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
  html,body{ height:100%; margin:0; background:#000; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; font-family:'Courier New', monospace; }
  canvas{ position:fixed; top:0; left:0; width:100%; height:100%; }
  #overlay{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 24px;
    max-width:90vw;
    max-height:85vh;
    overflow-y:auto;
  }
  #msg{
    font-size:clamp(18px, 4.5vw, 36px);
    color:#eaf6ff;
    text-shadow:0 0 8px #7fd0ff, 0 0 20px #3fa9ff;
    line-height:1.5;
    white-space:pre-wrap;
    font-weight:700;
    margin-bottom: 36px;
  }
  #choices{
    position:relative;
    display:flex;
    gap:20px;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.6s ease;
    min-height:70px;
  }
  #choices.show{ opacity:1; pointer-events:auto; }
  .choice-btn{
    font-family:'Courier New', monospace;
    font-size:clamp(15px,3.2vw,20px);
    font-weight:700;
    padding:14px 26px;
    border-radius:30px;
    cursor:pointer;
    border:2px solid #3fa9ff;
    background:rgba(63,169,255,0.12);
    color:#eaf6ff;
  }
  #yesBtn{
    background:#3fa9ff;
    color:#001827;
    transition: transform 0.25s ease;
  }
  #noBtn{
    position:relative;
    transition: transform 0.15s ease;
  }
  #heartOverlay{
    position:fixed; inset:0; z-index:5; pointer-events:none;
  }
  .heart{
    position:absolute;
    font-size:24px;
    filter: drop-shadow(0 0 6px rgba(255,159,207,0.7));
    animation: floatUp 3.4s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }
  @keyframes floatUp{
    0%{ transform:translate(0,0) rotate(0deg) scale(0.6); opacity:0; }
    12%{ opacity:1; transform:translate(0,-8vh) rotate(-4deg) scale(1); }
    50%{ transform:translate(var(--drift,20px),-48vh) rotate(6deg) scale(1.05); }
    100%{ transform:translate(calc(var(--drift,20px) * -1),-95vh) rotate(-4deg) scale(0.9); opacity:0; }
  }
  #finalMsg{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.85);
    z-index:6; text-align:center; font-family:'Courier New', monospace;
    color:#eaf6ff; font-size:clamp(22px,5vw,42px); font-weight:800;
    text-shadow:0 0 10px #ff9ecf, 0 0 25px #ff5fa8;
    opacity:0; pointer-events:none;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.34,1.56,0.64,1);
  }
  #finalMsg.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  #countdown{
    position:fixed; inset:0; z-index:4;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', monospace;
    color:#eaf6ff;
    font-size:clamp(60px, 20vw, 160px);
    font-weight:800;
    text-shadow:0 0 20px #3fa9ff, 0 0 50px #3fa9ff;
  }
  .cd-num{
    animation: cdPulse 0.9s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }
  @keyframes cdPulse{
    0%{ transform:scale(0.3); opacity:0; filter:blur(6px); }
    35%{ transform:scale(1.15); opacity:1; filter:blur(0); }
    70%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(1.4); opacity:0; }
  }
  .cursor{
    display:inline-block;
    width:0.5em;
    background:#eaf6ff;
    margin-left:4px;
    animation: blink 0.8s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  @keyframes shake{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-2px,1px); }
    50%{ transform:translate(2px,-1px); }
    75%{ transform:translate(-1px,-1px); }
    100%{ transform:translate(0,0); }
  }
  .shaking{ animation: shake 0.06s linear; }
  #soundBtn{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:3;
    background:rgba(255,255,255,0.08); color:#eaf6ff; border:1px solid rgba(255,255,255,0.25);
    border-radius:20px; padding:8px 14px; font-family:monospace; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
<button id="soundBtn">🔊 Bật âm thanh</button>
<canvas id="matrix"></canvas>
<div id="overlay">
  <div id="msg"></div>
  <div id="choices">
    <button id="yesBtn" class="choice-btn">Đồng ý 💙</button>
    <button id="noBtn" class="choice-btn">Không đồng ý</button>
  </div>
</div>
<div id="heartOverlay"></div>
<div id="finalMsg">Yayyy! 🎉<br>Cảm ơn em đã đồng ý 💙</div>
<div id="countdown"></div>

<script>
// ---- Matrix rain ----
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let w, h, columns, drops;
const chars = "アイウエオカキクケコサシスセソタチツテト0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  columns = Math.floor(w / fontSize);
  drops = new Array(columns).fill(1);
}
window.addEventListener('resize', resize);
resize();

function draw(){
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#3fa9ff';
  ctx.font = fontSize + 'px monospace';
  for(let i=0;i<drops.length;i++){
    const text = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize > h && Math.random() > 0.975){
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(draw, 40);

// ---- Sound (Web Audio, synthesized key click) ----
let audioCtx = null;
let soundOn = false;
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊 Âm thanh: Bật' : '🔈 Âm thanh: Tắt';
  if(soundOn){
    if(ambientTimer) clearTimeout(ambientTimer);
    ambientLoop();
  } else if(ambientTimer){
    clearTimeout(ambientTimer);
  }
});

function playClick(){
  if(!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 700 + Math.random()*250;
  gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

// ---- Ambient background pad (generative, loops softly) ----
const chords = [
  [261.63, 329.63, 392.00],   // C major
  [220.00, 277.18, 329.63],   // A minor
  [174.61, 220.00, 261.63],   // F major
  [196.00, 246.94, 293.66]    // G major
];
let chordIdx = 0;
let ambientTimer = null;

function playChord(freqs){
  if(!soundOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.045, now + 1.5);
  master.gain.linearRampToValueAtTime(0, now + 4.5);
  master.connect(audioCtx.destination);
  freqs.forEach(f => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    osc.connect(master);
    osc.start(now);
    osc.stop(now + 4.6);
  });
}

function ambientLoop(){
  playChord(chords[chordIdx % chords.length]);
  chordIdx++;
  ambientTimer = setTimeout(ambientLoop, 4200);
}

// ---- Shake effect ----
const overlay = document.getElementById('overlay');
function shake(){
  overlay.classList.remove('shaking');
  void overlay.offsetWidth; // restart animation
  overlay.classList.add('shaking');
}

// ---- Typewriter message (line by line, long content) ----
const lines = [
  "Gởi người anh thương.",
  "Anh muốn tiến xa hơn trong mối quan hệ này.",
  "Để được bên em, chăm sóc em.",
  "Đồng ý làm người yêu anh nhé..."
];
const msgEl = document.getElementById('msg');
let lineIdx = 0;
let charIdx = 0;

function typeWriter(){
  if(lineIdx >= lines.length) return;
  const currentLine = lines[lineIdx];
  if(charIdx <= currentLine.length){
    const partial = currentLine.slice(0, charIdx);
    msgEl.innerHTML = partial + '<span class="cursor">&nbsp;</span>';
    if(charIdx < currentLine.length && currentLine[charIdx] !== ' '){
      playClick();
      shake();
    }
    charIdx++;
    setTimeout(typeWriter, 90);
  } else if(lineIdx < lines.length - 1){
    // hold the finished sentence on screen, then clear and move to next
    setTimeout(() => {
      msgEl.innerHTML = '';
      lineIdx++;
      charIdx = 0;
      setTimeout(typeWriter, 400);
    }, 1400);
  } else {
    // last line stays on screen with blinking cursor, then reveal buttons
    msgEl.innerHTML = currentLine + '<span class="cursor">&nbsp;</span>';
    setTimeout(() => {
      document.getElementById('choices').classList.add('show');
    }, 900);
  }
}
// ---- Countdown intro (3, 2, 1, heart) then start typewriter ----
const countdownEl = document.getElementById('countdown');
const countdownSteps = ['3','2','1','💙'];
function runCountdown(i){
  if(i >= countdownSteps.length){
    countdownEl.style.display = 'none';
    setTimeout(typeWriter, 300);
    return;
  }
  countdownEl.innerHTML = '';
  const span = document.createElement('span');
  span.className = 'cd-num';
  span.textContent = countdownSteps[i];
  countdownEl.appendChild(span);
  playClick();
  setTimeout(() => runCountdown(i+1), 800);
}
setTimeout(() => runCountdown(0), 500);

// ---- Yes / No button interaction ----
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const heartOverlay = document.getElementById('heartOverlay');
const finalMsg = document.getElementById('finalMsg');

let yesScale = 1;
function dodgeNo(){
  const maxX = Math.min(120, window.innerWidth * 0.28);
  const maxY = 50;
  const x = (Math.random() * 2 - 1) * maxX;
  const y = (Math.random() * 2 - 1) * maxY;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
  yesScale = Math.min(yesScale + 0.06, 1.6);
  yesBtn.style.transform = `scale(${yesScale})`;
}
noBtn.addEventListener('mouseenter', dodgeNo);
noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodgeNo(); }, {passive:false});
noBtn.addEventListener('click', (e) => { e.preventDefault(); dodgeNo(); });

function spawnHearts(){
  const symbols = ['💙','💚','✨'];
  for(let i=0;i<36;i++){
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = symbols[i % symbols.length];
      h.style.left = (8 + Math.random()*84) + 'vw';
      h.style.bottom = '-30px';
      h.style.fontSize = (20 + Math.random()*8) + 'px';
      h.style.setProperty('--drift', (Math.random()*60 - 30) + 'px');
      heartOverlay.appendChild(h);
      setTimeout(() => h.remove(), 3500);
    }, i * 70);
  }
}

yesBtn.addEventListener('click', () => {
  document.getElementById('choices').classList.remove('show');
  spawnHearts();
  finalMsg.classList.add('show');
});
</script>
</body>
</html>
